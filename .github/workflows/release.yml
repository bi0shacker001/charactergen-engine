name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  server:
    name: Server (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: charactergen-server
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: charactergen-server.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: charactergen-server
    steps:
      - uses: actions/checkout@v4
      - name: Install RocksDB build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - name: Configure libclang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - run: cargo build --release -p charactergen-server --target ${{ matrix.target }}
      - shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" "dist/${{ matrix.artifact }}-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: dist/*

  publish:
    needs: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
