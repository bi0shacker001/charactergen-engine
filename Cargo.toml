[workspace]
resolver = "2"
members = [
  "crates/charactergen-core",
  "crates/charactergen-importers",
  "crates/charactergen-providers",
  "crates/charactergen-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/bi0shacker001/charactergen-engine"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
schemars = { version = "1", features = ["uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7", "serde"] }
